name: CI

# Tests with coverage (thresholds in vitest.config.ts) and typecheck on every push and pull request (N2.3, N3).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26.x
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Tests mit Abdeckung
        run: npm run test:coverage
